<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e20">
<meta name="color-scheme" content="dark">
<title>高频词组背题器</title>
<style>
  :root{
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    --glass-border: rgba(255,255,255,.30);
    --text-dim: rgba(255,255,255,.78);
    --ok:#2ee6a6; --bad:#ff6b81;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#fff; background:#0a0e20; overflow-x:hidden;
    min-height:100vh; min-height:100dvh;
  }

  /* ---------- animated liquid background ---------- */
  .bg{ position:fixed; inset:0; z-index:-1;
    background: linear-gradient(160deg,#0a0e20 0%, #141b3f 55%, #1d1440 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; will-change:transform; }
  .b1{ width:60vmax; height:60vmax; top:-20vmax; left:-18vmax; background:#4f5dff; animation:float1 17s ease-in-out infinite alternate; }
  .b2{ width:50vmax; height:50vmax; bottom:-16vmax; right=-14vmax; background:#ff5ba8; animation:float2 21s ease-in-out infinite alternate; }
  .b3{ width:40vmax; height:40vmax; top:30%; left:45%; background:#2fd8ff; opacity:.35; animation:float3 19s ease-in-out infinite alternate; }
  @keyframes float1{ to{ transform:translate(22%,16%) scale(1.18); } }
  @keyframes float2{ to{ transform:translate(-18%,-14%) scale(1.12) rotate(30deg); } }
  @keyframes float3{ to{ transform:translate(-25%,10%) scale(.9); } }

  /* ---------- glass primitives ---------- */
  .glass{ background:var(--glass-bg); border:1px solid var(--glass-border);
    backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 14px 34px rgba(0,0,0,.32); }
  .glass-pill{ display:inline-flex; align-items:center; gap:.5rem; padding:.55rem 1.05rem; border-radius:999px;
    font-size:.86rem; color:var(--text-dim); user-select:none; white-space:nowrap; }

  /* ---------- screens ---------- */
  .screen{ display:none; min-height:100vh; min-height:100dvh; padding:24px 18px calc(26px + env(safe-area-inset-bottom)); }
  .screen.active{ display:flex; align-items:center; justify-content:center; animation:screenIn .5s ease both; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

  /* ---------- home ---------- */
  #screen-home{ flex-direction:column; text-align:center; gap:20px; }
  .logo-chip{ width:86px; height:86px; border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:2.3rem; margin:0 auto; }
  .app-title{ font-size:clamp(1.7rem,6vw,2.5rem); font-weight:800; letter-spacing:.06em;
    background:linear-gradient(90deg,#fff 30%, #cfd4ff 70%); -webkit-background-clip:text; background-clip:text; }
  .subtitle{ color:var(--text-dim); font-size:.95rem; letter-spacing:.12em; }
  .home-actions{ display:flex; flex-direction:column; gap:14px; width:min(400px,100%); margin-top:6px; }
  .cta-btn{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 26px; border-radius:20px;
    font-size:1.18rem; font-weight:700; letter-spacing:.04em; cursor:pointer; transition:.25s; color:#fff; }
  .cta-btn small{ font-size:.8rem; font-weight:400; opacity:.85; letter-spacing:.03em; }
  .cta-btn.primary{ background:linear-gradient(135deg,#7b6cff, #39c0ff); border:1px solid rgba(255,255,255,.4);
    box-shadow: 0 12px 30px rgba(86,120,255,.42), inset 0 1px 0 rgba(255,255,255,.5); }
  .cta-btn.secondary{ background:var(--glass-bg); border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 26px rgba(0,0,0,.28); }
  .cta-btn:hover{ transform:translateY(-2px) scale(1.01); }
  .cta-btn:active{ transform:scale(.985); }
  .hint-note{ font-size:.83rem; color:var(--text-dim); opacity:.75; }

  /* ---------- quiz ---------- */
  #screen-quiz{ flex-direction:column; align-items:center; justify-content:flex-start; padding-top:max(20px, env(safe-area-inset-top)); }
  .quiz-wrap{ width:min(760px,100%); display:flex; flex-direction:column; gap:clamp(14px,3vh,24px); min-height:calc(100dvh - 2*max(20px, env(safe-area-inset-top)) - 2*env(safe-area-inset-bottom)); }
  .quiz-header{ display:flex; justify-content:space-between; align-items:center; }
  .ghost-btn{ cursor:pointer; font-size:.9rem; }
  #counter{ font-weight:600; letter-spacing:.05em; }
  .progress-track{ height:8px; border-radius:99px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#7b6cff,#39c0ff); transition:width .45s ease; }
  .quiz-main{ display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; justify-content:center; flex:1; }
  .word-card{ padding:clamp(26px,6vh,44px) clamp(20px,5vw,48px); border-radius:26px; text-align:center; max-width:760px; width:100%; }
  .word-label{ font-size:.8rem; letter-spacing:.22em; color:var(--text-dim); margin-bottom:14px; }
  #wordText{ font-size:clamp(1.35rem,5.4vw,2.25rem); font-weight:700; line-height:1.4; overflow-wrap:anywhere; }
  .divider{ width:64px; height:3px; margin:22px auto 0; border-radius:99px; background:linear-gradient(90deg,#7b6cff,#39c0ff); opacity:.85; }
  #hintBtn{ cursor:pointer; font-size:.9rem; }
  #hintBtn.used{ opacity:.45; pointer-events:none; }

  .choices{ display:grid; gap:12px; width:100%; max-width:760px; }
  @media (min-width:700px){ .choices{ grid-template-columns:1fr 1fr; } }
  .choice{ position:relative; text-align:left; display:flex; align-items:center; gap:12px;
    padding:15px 18px; border-radius:18px; font-size:clamp(.98rem,3.6vw,1.08rem); line-height:1.45; cursor:pointer;
    color:#fff; background:var(--glass-bg); border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 6px 18px rgba(0,0,0,.18); transition:.2s; user-select:none; touch-action:manipulation; }
  .choice:hover{ transform:translateY(-2px); }
  .choice:active{ transform:scale(.99); }
  .tag{ flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.85rem; background:rgba(255,255,255,.16); }
  .mark{ margin-left:auto; font-weight:800; opacity:0; width:1.1em; text-align:center; flex:none; }
  .choice.dim{ opacity:.38; filter:saturate(.4); pointer-events:none; }
  .choice.eliminated{ opacity:.26; filter:saturate(.3); pointer-events:none; }
  .choice.correct{ border-color:var(--ok); background:linear-gradient(135deg, rgba(46,230,166,.38), rgba(46,230,166,.10)); box-shadow:0 0 24px rgba(46,230,166,.30); }
  .choice.correct .tag{ background:#2ee6a6; color:#06281d; }
  .choice.correct .mark{ opacity:1; color:var(--ok); }
  .choice.wrong{ border-color:var(--bad); background:linear-gradient(135deg, rgba(255,107,129,.34), rgba(255,107,129,.10)); box-shadow:0 0 24px rgba(255,107,129,.28); animation:shake .4s; }
  .choice.wrong .tag{ background:#ff6b81; color:#3a0a12; }
  .choice.wrong .mark{ opacity:1; color:var(--bad); }
  @keyframes shake{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-6px) } 60%{ transform:translateX(5px) } }

  .next-slot{ height:74px; display:flex; align-items:center; justify-content:center; }
  #btnNext{ padding:14px 44px; border-radius:999px; font-size:1.05rem; letter-spacing:.06em; cursor:pointer; }

  /* ---------- result ---------- */
  .result-card{ width:min(620px,100%); padding:clamp(28px,7vw,54px) clamp(20px,6vw,52px); border-radius:28px; text-align:center; }
  .result-title{ font-size:.95rem; color:var(--text-dim); letter-spacing:.2em; margin-bottom:10px; }
  #pctText{ font-size:clamp(4rem,22vw,6.4rem); font-weight:800; line-height:1.1; letter-spacing:-.02em;
    background:linear-gradient(90deg,#7b6cff,#39c0ff 55%,#fff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #resultMsg{ font-size:clamp(1rem,4.4vw,1.25rem); margin-top:8px; min-height:1.6em; }
  .stats-row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:18px 0 26px; }
  .stat-pill{ padding:.45rem .95rem; border-radius:999px; font-size:.85rem; color:var(--text-dim); background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.2); }
  .result-btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn-round{ padding:.8rem 1.4rem; border-radius:999px; font-size:.95rem; letter-spacing:.03em; cursor:pointer; }
  .btn-round.primary{ background:linear-gradient(135deg,#7b6cff,#39c0ff); border:1px solid rgba(255,255,255,.4); font-weight:600; box-shadow:0 8px 22px rgba(86,120,255,.4); }
  .btn-round.glassy{ background:var(--glass-bg); border:1px solid var(--glass-border); color:#fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 6px 16px rgba(0,0,0,.24); }

  /* ---------- details sheet ---------- */
  .sheet{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; visibility:hidden; opacity:0; transition:.3s; background:transparent; }
  .sheet.open{ visibility:visible; opacity:1; }
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(6,8,24,.55); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%); }
  .sheet-panel{ position:relative; width:min(720px,100%); max-height:calc(100dvh - 36px); border-radius:24px; display:flex; flex-direction:column; overflow:hidden; }
  .sheet.open .sheet-panel{ transform:none; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,.16); flex:none; }
  .sheet-body{ overflow:auto; overscroll-behavior:contain; padding:6px 20px 20px; }
  #btnCloseDetails{ cursor:pointer; }

  /* ---------- generic modal ---------- */
  .modal{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:18px; visibility:hidden; opacity:0; transition:.25s; background:transparent; }
  .modal.open{ visibility:visible; opacity:1; }
  .modal-backdrop{ position:absolute; inset:0; background:rgba(6,8,24,.5); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%); }
  .modal-panel{ position:relative; width:min(380px,100%); padding:26px 24px; border-radius:24px; text-align:center; display:flex; flex-direction:column; gap:14px; animation:none; }
  .modal.open .modal-panel{ transform:none; }
  .modal-title{ font-size:1.15rem; font-weight:700; letter-spacing:.03em; }
  #countInput{ width:100%; padding:14px 16px; border-radius:14px; font-size:1.2rem; text-align:center; color:#fff; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.3); outline:none; }
  #countInput:focus{ border-color:#7b6cff; }
  .chips{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .chip{ cursor:pointer; padding:.4rem .9rem; border-radius:999px; font-size:.85rem; color:var(--text-dim); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); }
  .chip.active{ color:#fff; background:linear-gradient(135deg,#7b6cff,#39c0ff); border-color:transparent; font-weight:600; }
  .modal-btns{ display:flex; gap:10px; }
  .modal-btns .btn-round{ flex:1; }

  /* ---------- detail rows ---------- */
  .detail-row{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid rgba(255,255,255,.10); font-size:.92rem; }
  .d-idx{ flex:none; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:.74rem; font-weight:700; background:rgba(255,255,255,.12); color:var(--text-dim); }
  .d-main{ min-width:0; }
  .d-en{ font-weight:600; overflow-wrap:anywhere; }
  .d-zh{ margin-top:3px; font-size:.84rem; display:flex; gap:10px; flex-wrap:wrap; color:var(--text-dim); align-items:center; }
  .ok-tag,.bad-tag{ padding:.15em .55em; border-radius:6px; font-size:.82rem; white-space:nowrap; }
  .ok-tag{ background:rgba(46,230,166,.16); color:#7df0c9; border:1px solid rgba(46,230,166,.45); }
  .bad-tag{ background:rgba(255,107,129,.14); color:#ffb3be; border:1px solid rgba(255,107,129,.45); }
  .hint-mark{ font-size:.8rem; opacity:.8; white-space:nowrap; }

  @media (min-width:700px){ body{ min-height:100vh; } }
  @media (prefers-reduced-motion:reduce){ .blob,.screen,.progress-fill{ animation:none !important; transition:none !important; } .choice.wrong{ animation:none; } }
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<!-- ============ 首页 ============ -->
<section id="screen-home" class="screen">
  <div class="logo-chip glass">📚</div>
  <h1 class="app-title">高频词组背题器</h1>
  <p class="subtitle">北京市高职升本 · 招生统一考试</p>
  <span id="homeCount" class="glass-pill"></span>
  <div class="home-actions">
    <button id="btnCustom" class="cta-btn primary">自定义刷题数量<small id="customSub">自选题量，随机出题</small></button>
    <button id="btnFull" class="cta-btn secondary">全量刷题<small id="fullSub">覆盖全部词组</small></button>
  </div>
  <p class="hint-note">💡 每题可点「提示」排除错误选项，共两次机会</p>
</section>

<!-- ============ 做题界面 ============ -->
<section id="screen-quiz" class="screen">
  <div class="quiz-wrap">
    <header class="quiz-header">
      <button id="btnExit" class="glass-pill ghost-btn">‹ 首页</button>
      <span id="counter" class="glass-pill"></span>
    </header>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    <div class="quiz-main">
      <div class="word-card glass">
        <div class="word-label">选择正确的中文释义</div>
        <h2 id="wordText"></h2>
        <div class="divider"></div>
      </div>
      <button id="hintBtn" class="glass-pill">💡 提示（剩余 2）</button>
    </div>
    <div id="choices" class="choices"></div>
    <div class="next-slot"><button id="btnNext" class="cta-btn primary">下一题 →</button></div>
  </div>
</section>

<!-- ============ 成绩界面 ============ -->
<section id="screen-result" class="screen">
  <div class="result-card glass">
    <p class="result-title">本 轮 成 绩</p>
    <div id="pctText"></div>
    <p id="resultMsg"></p>
    <div class="stats-row">
      <span class="stat-pill" id="statScore"></span>
      <span class="stat-pill" id="statTime"></span>
    </div>
    <div class="result-btns">
      <button id="btnDetails" class="glass-pill btn-round glassy">📋 查看详情</button>
      <button id="btnAgain" class="btn-round primary">再来一次</button>
      <button id="btnHome2" class="glass-pill btn-round glassy">返回首页</button>
    </div>
  </div>
</section>

<!-- ============ 答题详情浮层 ============ -->
<div id="sheetDetails" class="sheet">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel glass">
    <header class="sheet-head">
      <span style="font-weight:700;letter-spacing:.05em">答题详情</span>
      <button id="btnCloseDetails" class="glass-pill ghost-btn">✕ 关闭</button>
    </header>
    <div class="sheet-body" id="detailList"></div>
  </div>
</div>

<!-- ============ 弹窗：自定义数量 / 退出确认 ============ -->
<div id="modalCount" class="modal">
  <div class="modal-backdrop"></div>
  <div class="modal-panel glass">
    <p class="modal-title">选择刷题数量</p>
    <input id="countInput" type="number" min="1" max="241" inputmode="numeric" value="20">
    <div class="chips">
      <button data-n="10" class="chip">10</button><button data-n="20" class="chip active">20</button>
      <button data-n="50" class="chip">50</button><button data-n="100" class="chip">100</button>
    </div>
    <div class="modal-btns">
      <button id="countCancel" class="glass-pill btn-round glassy">取消</button>
      <button id="countOk" class="btn-round primary">开始刷题</button>
    </div>
  </div>
</div>

<div id="modalExit" class="modal">
  <div class="modal-backdrop"></div>
  <div class="modal-panel glass">
    <p class="modal-title">中途退出？</p>
    <p style="font-size:.9rem;color:var(--text-dim)">本轮进度将不保存</p>
    <div class="modal-btns">
      <button id="exitStay" class="glass-pill btn-round glassy">继续刷题</button>
      <button id="exitGo" class="btn-round primary">退出</button>
    </div>
  </div>
</div>

const TOTAL = DATA.length;
const ZH_POOL = Array.from(new Set(DATA.map(d => d.zh)));

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const $ = id => document.getElementById(id);

/* ---------- 组卷：随机抽取 + 四选一选项 ---------- */
function sampleItems(n){
  const src = DATA.slice();
  for(let i=0;i<n;i++){ const j=(Math.random()*(src.length-i))|0; const t=src[i]; src[i]=src[j]; src[j]=t; }
  return src.slice(0,n);
}
function makeQuestions(n){
  const items = n>=TOTAL ? DATA.slice() : sampleItems(n);
  shuffle(items);
  return items.map(item=>{
    const wrongs = shuffle(ZH_POOL.filter(z=>z!==item.zh)).slice(0,3);
    const options = shuffle([item.zh].concat(wrongs));
    return { item:item, options:options, answerIdx:options.indexOf(item.zh) };
  });
}

/* ---------- 状态 ---------- */
let quiz=null, locked=false, revealTimer=null, hintLeft=2;

function startQuiz(n){
  clearTimeout(revealTimer);
  quiz = { questions:makeQuestions(n), idx:0, score:0, answers:[], hints:Array(n).fill(false) };
  quiz.startedAt = Date.now();
  renderQuestion(); showScreen('screen-quiz');
}

function showScreen(id){
  ['screen-home','screen-quiz','screen-result'].forEach(s=>$(s).classList.toggle('active', s===id));
  window.scrollTo(0,0);
}

/* ---------- 渲染一题 ---------- */
function renderQuestion(){
  clearTimeout(revealTimer);
  const q=quiz.questions[quiz.idx];
  locked=false;
  $('counter').textContent='第 '+(quiz.idx+1)+' / '+quiz.questions.length;
  $('progressFill').style.width=(quiz.idx/quiz.questions.length*100)+'%';
  $('wordText').textContent=q.item.en;
  const box=$('choices');
  box.innerHTML='';
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    const tag=document.createElement('span'); tag.className='tag'; tag.textContent='ABCD'[i];
    const text=document.createElement('span'); text.className='text'; text.textContent=opt;
    const mark=document.createElement('span'); mark.className='mark';
    b.appendChild(tag); b.appendChild(text); b.appendChild(mark);
    b.onclick=()=>onChoice(i);
    box.appendChild(b);
  });
  hintLeft=2;
  $('hintBtn').disabled=false; $('hintBtn').style.opacity=''; updateHintBtn();
  $('btnNext').style.display='none';
}

function updateHintBtn(){
  const btn=$('hintBtn');
  if(hintLeft<=0){ btn.textContent='💡 提示已用完'; }
  else { btn.textContent='💡 提示（剩余 '+hintLeft+'）'; }
}

/* ---------- 答题 ---------- */
function onChoice(i){
  if(locked) return;
  locked=true;
  const q=quiz.questions[quiz.idx];
  const ok = i===q.answerIdx;
  if(ok) quiz.score++;
  quiz.answers.push({ en:q.item.en, zh:q.item.zh, chosen:q.options[i], ok:ok });
  reveal(i);
}

function reveal(chosen){
  const q=quiz.questions[quiz.idx];
  const ok = (chosen===q.answerIdx);
  const btns=$('choices').children;
  for(let j=0;j<btns.length;j++){
    if(j===q.answerIdx){ btns[j].classList.add('correct'); btns[j].querySelector('.mark').textContent='✓'; }
    else if(j===chosen){ btns[j].classList.add('wrong'); btns[j].querySelector('.mark').textContent='✗'; }
    else { btns[j].classList.add('dim'); }
  }
  const hb=$('hintBtn'); hb.disabled=true; hb.style.opacity='0.35';
  $('progressFill').style.width=((quiz.idx+1)/quiz.questions.length*100)+'%';

  const last = quiz.idx===quiz.questions.length-1;
  const advance = ()=>{ if(last){ finishQuiz(); } else { quiz.idx++; renderQuestion(); } };
  if(ok){ revealTimer=setTimeout(advance,950); }
  else {
    $('btnNext').textContent = last ? '查看成绩' : '下一题 →';
    $('btnNext').onclick=advance;
    $('btnNext').style.display='';
  }
}

/* ---------- 提示：排除一个错误选项 ---------- */
function useHint(){
  if(locked||hintLeft<=0) return;
  const q=quiz.questions[quiz.idx];
  const btns=$('choices').children;
  const wrongs=[];
  for(let j=0;j<btns.length;j++){ if(j!==q.answerIdx && !btns[j].classList.contains('eliminated')) wrongs.push(j); }
  if(!wrongs.length) return;
  btns[wrongs[(Math.random()*wrongs.length)|0]].classList.add('eliminated');
  quiz.hints[quiz.idx]=true;
  hintLeft--;
  updateHintBtn();
}

/* ---------- 结算 ---------- */
function finishQuiz(){
  clearTimeout(revealTimer);
  const N=quiz.questions.length;
  const sec=Math.floor((Date.now()-quiz.startedAt)/1000);
  const pct=Math.round(quiz.score/N*100);
  $('pctText').textContent=pct+'%';
  $('resultMsg').textContent=msgFor(pct);
  $('statScore').textContent='答对 '+quiz.score+' / '+N;
  $('statTime').textContent='用时 '+fmt(sec);
  showScreen('screen-result');
}
function msgFor(p){
  if(p>=95) return '稳操胜券，词组全熟！';
  if(p>=85) return '表现优秀，继续保持！';
  if(p>=70) return '不错！再巩固一下即可。';
  if(p>=50) return '已有基础，继续加油！';
  return '别灰心，多练几遍就熟了。';
}
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m>0 ? m+'分'+String(s).padStart(2,'0')+'秒' : s+'秒'; }

/* ---------- 详情 / 弹窗 ---------- */
function showDetails(){
  const list=$('detailList');
  list.innerHTML='';
  quiz.questions.forEach((q,i)=>{
    const a=quiz.answers[i]; if(!a) return;
    const row=document.createElement('div');
    row.className='detail-row';
    row.style.borderLeft='3px solid '+(a.ok?'#2ee6a6':'rgba(255,107,129,.8)');
    const idx=document.createElement('span'); idx.className='d-idx'; idx.textContent=i+1;
    const main=document.createElement('div'); main.className='d-main';
    const en=document.createElement('div'); en.className='d-en'; en.textContent=q.item.en;
    const zhLine=document.createElement('div'); zhLine.className='d-zh';
    const okTag=document.createElement('span'); okTag.className='ok-tag'; okTag.textContent='✓ '+q.item.zh;
    zhLine.appendChild(okTag);
    if(!a.ok){ const bad=document.createElement('span'); bad.className='bad-tag'; bad.textContent='你选了：'+a.chosen; zhLine.appendChild(bad); }
    if(quiz.hints[i]){ const mk=document.createElement('span'); mk.className='hint-mark'; mk.textContent='💡已用提示'; zhLine.appendChild(mk); }
    main.appendChild(en); main.appendChild(zhLine);
    row.appendChild(idx); row.appendChild(main);
    list.appendChild(row);
  });
  $('sheetDetails').classList.add('open');
}

  $('btnNext').onclick();
  const q2=quiz.questions[1];
  onChoice(q2.answerIdx);
  T('scoreNow1',quiz.score===1);
  setTimeout(()=>{
    T('finishedAtResult',$('screen-result').classList.contains('active'));
    T('pct50',$('pctText').textContent==='50%');
    showDetails();
    T('detailsRows',$('detailList').children.length===2);
    $('sheetDetails').classList.remove('open');
    const rep=document.createElement('div'); rep.id='testreport';
    rep.textContent='TESTREPORT '+(fails.length?'FAIL ':'PASS ')+'fail='+JSON.stringify(fails)+' passCount='+passes.length;
    document.body.appendChild(rep);
  },1500);
}
else { showScreen('screen-home'); }
</script>
</body></html>
